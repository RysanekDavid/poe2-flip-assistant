[project]
name = "poe2-flip-coach"
version = "0.1.0"
description = "Internal LangGraph coach for the PoE2 trading application."
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<4.0.0",
    "langchain>=1.3.0,<2.0.0",
    "langchain-openai>=1.3.0,<2.0.0",
    "langchain-qdrant>=1.1.0,<2.0.0",
    "langchain-text-splitters>=1.1.0,<2.0.0",
    "qdrant-client>=1.18.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "tavily-python>=0.7.0,<1.0.0",
    "fastapi>=0.139.0,<1.0.0",
    "uvicorn[standard]>=0.40.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "python-dotenv>=1.2.0,<2.0.0",
    "rank-bm25>=0.2.2,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
